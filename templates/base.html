<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
        rel="stylesheet"
    >

    <!-- FontAwesome -->
    <link 
        rel="stylesheet" 
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >

    <title>{% block title %}Social Medi4{% endblock %}</title>

    <style>

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
        }

        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        footer {
            flex-shrink: 0;
        }

        /* Ajustes para celulares */
        @media (max-width: 767px) {

            main {
                margin-top: 0 !important;
                padding-left: 10px !important;
                padding-right: 10px !important;
            }

        }

    </style>

</head>

<body>

    {% include 'navbar.html' %}

    <main class="container-fluid px-2 px-md-4">

        {% block content %}
        {% endblock %}

    </main>

    <footer class="py-3 bg-dark text-center text-white">

        <h4 class="fw-bold mb-1">
            🌐 Redes Sociales
        </h4>

        <p class="mb-1">
            Registro de Usuarios y sus Metodologías
        </p>

        <a 
            href="https://github.com/Iv4n-0v"
            target="_blank"
            class="text-info text-decoration-none"
        >
            <small>by Ivan V.</small>
        </a>

    </footer>

    <!-- Bootstrap JS -->
    <script 
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
