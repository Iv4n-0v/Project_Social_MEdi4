{% extends 'base.html' %}
{% block title %}Editar User{% endblock %}
{% block content %}

<div class="container mt-4">
    <h2>Editar Usuario</h2>

    <form action="/users/{{ user.id }}/update" method="post">

        <label class="form-label">Nombre</label>
        <input type="text" class="form-control" name="name" value="{{ user.name }}" required>

        <label class="form-label mt-3">Metodologías</label>
        <select class="form-select" name="methodology_ids" multiple size="5">
            {% for m in methodologies %}
                <option value="{{ m.id }}" 
                    {% if m in user.methodologies %}selected{% endif %}>
                    {{ m.name }}
                </option>
            {% endfor %}
        </select>

        {% if user.img %}
            <img src="{{ user.img }}" width="80" class="mt-3">
        {% else %}
            <p>No tiene imagen</p>
        {% endif %}

        <button class="btn btn-primary mt-3" type="submit">Guardar cambios</button>

    </form>
</div>

{% endblock %}
