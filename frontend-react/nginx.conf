server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Todo lo que empiece por /api/ va al gateway KrakenD (misma origen, sin CORS)
  location /api/ {
    proxy_pass http://gateway:8080;
    proxy_set_header Host $host;
    client_max_body_size 6m;
  }

  location = /health {
    default_type text/plain;
    return 200 'ok';
  }

  # React Router: cualquier otra ruta devuelve index.html
  location / {
    try_files $uri /index.html;
  }
}
