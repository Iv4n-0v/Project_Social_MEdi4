{% extends 'base.html' %}
{% block title %}Crear Metodologia{% endblock %}
{% block content %}

<div class="container mt-4">
    <h2>Crear Nueva Metodología</h2>

    <form action="/methodologies/new" method="post">

        <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Seleccionar beneficios</label>
            <select name="benefit_ids" multiple class="form-control">
        {% for benefit in benefits %}
            <option value="{{ benefit.id }}">{{ benefit.name }}</option>
        {% endfor %}
            </select>
            <small class="text-muted">Mantén presionado CTRL para seleccionar varios.</small>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="/methodologies" class="btn btn-secondary">Cancelar</a>
    </form>
</div>

{% endblock %}
