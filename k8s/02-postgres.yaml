# Crea las bases de datos de los microservicios (solo corre con el volumen vacío;
# si el volumen ya existe, créalas a mano: ver docs/reorientacion/GUIA_FASE7.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: social-media
data:
  init.sql: |
    CREATE DATABASE beneficios;
    CREATE DATABASE analisis;
    CREATE DATABASE auth;
    CREATE DATABASE emprendimientos;
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: social-media
spec:
  clusterIP: None        # headless: el nombre "db" resuelve al pod de Postgres
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: social-media
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
